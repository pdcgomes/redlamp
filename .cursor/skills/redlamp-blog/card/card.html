<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  A blog post's social card, 1600 × 900 CSS pixels: the lockup, "From the blog", the title, two lines
  beneath it and the address, lit by the lamp from the upper left. render.py fills it from a post's
  card.json with window.build(card) and poses it with window.frame(t), over a 6.4 s loop. Opened on
  its own, it shows the first card, Testing cameras I don't own.
-->
<style>
  @font-face {
    font-family: "Inter";
    src: url("../../../../video/public/fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }
  html, body { margin: 0; }
  body {
    width: 1600px;
    height: 900px;
    overflow: hidden;
    position: relative;
    background: #0a0707;
    color: #f3eee8;
    font-family: "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .glow { position: absolute; inset: 0; will-change: opacity; }
  .spread {
    background: radial-gradient(62% 78% at 24% 0%, rgb(224 64 46 / 0.30), rgb(224 64 46 / 0.08) 46%, transparent 76%);
  }
  .core { background: radial-gradient(24% 26% at 24% 2%, rgb(255 176 138 / 0.14), transparent 70%); }
  .card {
    position: absolute;
    inset: 0;
    padding: 104px 120px 96px;
    display: flex;
    flex-direction: column;
  }
  .lockup { height: 68px; width: auto; align-self: flex-start; will-change: transform, opacity, filter; }
  .body { margin-top: auto; }
  .eyebrow {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #a89d98;
  }
  h1 {
    margin: 22px 0 0;
    font-size: 128px;
    line-height: 1.0;
    font-weight: 600;
    font-variation-settings: "opsz" 32;
    letter-spacing: -0.022em;
  }
  .mask { display: block; overflow: hidden; padding-bottom: 0.14em; margin-bottom: -0.14em; }
  .line { display: block; will-change: transform, opacity; }
  p {
    margin: 34px 0 0;
    font-size: 36px;
    line-height: 1.38;
    color: #a89d98;
    font-variation-settings: "opsz" 20;
  }
  p .line { display: block; }
  .num { display: inline-block; color: #f3eee8; will-change: transform; }
  .url {
    margin-top: 56px;
    font-size: 26px;
    color: #6f6561;
    font-variation-settings: "opsz" 18;
  }
</style>
</head>
<body>
  <div class="glow spread" id="spread"></div>
  <div class="glow core" id="core"></div>
  <div class="card">
    <img class="lockup" id="lockup" src="../../../../docs/brand/logo/redlamp-lockup.svg" alt="Redlamp">
    <div class="body">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <div class="url" id="url"></div>
    </div>
  </div>
<script>
  const EXAMPLE = {
    title: ["Testing cameras", "I don’t own"],
    subtitle: [
      "LibRaw opens [1,258] cameras, and Redlamp’s tests check [25].",
      "This is how the other [1,233] get tested.",
    ],
  };
  const T = 6.4;
  const $ = (id) => document.getElementById(id);
  let shape = { titleLines: 0, subtitleLines: 0, numbers: 0 };

  // A card's words: `title` and `subtitle` are lists of lines; a [bracketed] part of a subtitle line
  // is a number, set in the title's colour with a beat of its own.
  window.build = (card) => {
    $("eyebrow").textContent = card.eyebrow ?? "From the blog";
    $("url").textContent = card.url ?? "redlamp.app/blog";
    const title = $("title");
    title.replaceChildren();
    if (card.titleSize) title.style.fontSize = `${card.titleSize}px`;
    card.title.forEach((text, i) => {
      const mask = document.createElement("span");
      mask.className = "mask";
      const line = document.createElement("span");
      line.className = "line";
      line.id = `t${i + 1}`;
      line.textContent = text;
      mask.append(line);
      title.append(mask);
    });
    const subtitle = $("subtitle");
    subtitle.replaceChildren();
    let numbers = 0;
    card.subtitle.forEach((text, i) => {
      const line = document.createElement("span");
      line.className = "line";
      line.id = `s${i + 1}`;
      for (const [index, part] of text.split(/\[([^\]]+)\]/).entries()) {
        if (index % 2 === 0) {
          line.append(part);
        } else {
          const number = document.createElement("span");
          number.className = "num";
          number.id = `n${++numbers}`;
          number.textContent = part;
          line.append(number);
        }
      }
      subtitle.append(line);
    });
    shape = { titleLines: card.title.length, subtitleLines: card.subtitle.length, numbers };
    window.frame(4.3);
  };

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, start, duration) => clamp((t - start) / duration);
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  // A damped spring from 0 to 1, by seconds since it started: a little overshoot, settled in about 0.7 s.
  function spring(seconds, zeta = 0.68, period = 0.62) {
    if (seconds <= 0) return 0;
    const omega = (2 * Math.PI) / period;
    const damped = omega * Math.sqrt(1 - zeta * zeta);
    const decay = Math.exp(-zeta * omega * seconds);
    return 1 - decay * (Math.cos(damped * seconds) + ((zeta * omega) / damped) * Math.sin(damped * seconds));
  }
  // Every element leaves the same way, newest first, before the lamp dims.
  const leave = (t, start) => easeInOut(prog(t, start, 0.45));
  function style(id, { opacity = 1, y = 0, yUnit = "px", blur = 0, scale = 1, spacing = null }) {
    const node = $(id);
    node.style.opacity = opacity.toFixed(4);
    node.style.transform = `translateY(${y.toFixed(3)}${yUnit}) scale(${scale.toFixed(4)})`;
    node.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "none";
    if (spacing !== null) node.style.letterSpacing = `${spacing.toFixed(4)}em`;
  }
  window.frame = (t) => {
    // Each title line past the second delays what follows it by one line's beat.
    const later = 0.13 * Math.max(0, shape.titleLines - 2);
    // The lamp warms up: the filament first, then its red light spreads over the wall and settles.
    const dim = 1 - easeInOut(prog(t, 5.6, 0.7));
    $("core").style.opacity = (easeOut(prog(t, 0.0, 0.45)) * dim).toFixed(4);
    $("spread").style.opacity = (clamp(spring(t - 0.12, 0.82, 1.3), 0, 1.06) * dim).toFixed(4);

    let o = leave(t, 5.55);
    style("lockup", {
      opacity: easeOut(prog(t, 0.3, 0.5)) * (1 - o),
      y: 18 * (1 - spring(t - 0.3)) - 8 * o,
      blur: 8 * (1 - easeOut(prog(t, 0.3, 0.45))) + 5 * o,
    });
    o = leave(t, 5.5);
    style("eyebrow", {
      opacity: easeOut(prog(t, 0.62, 0.5)) * (1 - o),
      y: 10 * (1 - spring(t - 0.62)) - 8 * o,
      blur: 5 * o,
      spacing: 0.14 + 0.22 * (1 - easeOut(prog(t, 0.62, 0.9))),
    });
    o = leave(t, 5.45);
    for (let i = 0; i < shape.titleLines; i++) {
      const start = 0.8 + 0.13 * i;
      style(`t${i + 1}`, {
        opacity: easeOut(prog(t, start, 0.35)) * (1 - o),
        y: 108 * (1 - spring(t - start)) - 6 * o,
        yUnit: "%",
        blur: 5 * o,
      });
    }
    o = leave(t, 5.4);
    for (let i = 0; i < shape.subtitleLines; i++) {
      const start = 1.45 + 0.15 * i + later;
      style(`s${i + 1}`, {
        opacity: easeOut(prog(t, start, 0.6)) * (1 - o),
        y: 14 * (1 - spring(t - start, 0.85)) - 8 * o,
        blur: 6 * (1 - easeOut(prog(t, start, 0.5))) + 5 * o,
      });
    }
    const beats = [1.6, 1.72, 1.82];
    for (let i = 0; i < shape.numbers; i++) {
      const start = (beats[i] ?? 1.82 + 0.1 * (i - 2)) + later;
      style(`n${i + 1}`, { scale: 0.9 + 0.1 * spring(t - start, 0.55, 0.5) });
    }
    o = leave(t, 5.35);
    style("url", {
      opacity: easeOut(prog(t, 2.15 + later, 0.6)) * (1 - o),
      y: 8 * (1 - spring(t - 2.15 - later, 0.9)) - 6 * o,
      blur: 5 * o,
    });
  };
  window.build(EXAMPLE);
</script>
</body>
</html>
