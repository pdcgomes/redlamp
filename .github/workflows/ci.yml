name: CI

# A probe, on its own branch and never merged: the histogram graph's references on the runner.
on:
  pull_request:
    branches: [main]

jobs:
  histogram-probe:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise tools
        uses: jdx/mise-action@v2

      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: The runner's screens, appearance, symbol layout and colours
        run: xcrun swift scripts/probe-histogram.swift

      - name: Cache vendored LibRaw
        uses: actions/cache@v4
        with:
          path: vendor/build
          key: libraw-${{ hashFiles('config/vendored-libs.json', 'vendor/shims/**', 'scripts/vendor-libraw.sh') }}

      - name: Generate workspace
        run: mise run generate

      - name: Histogram graph tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/probe
          xcodebuild test \
            -workspace Redlamp.xcworkspace \
            -scheme RedlampUITests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:RedlampUITests/HistogramGraphViewTests \
            | tee build/probe/test.log | grep -E "error:|✔ Test|✘|↳|TEST (SUCCEEDED|FAILED)"

      - name: Collect what the test drew
        if: always()
        run: |
          mkdir -p build/probe
          for dir in "$TMPDIR" "$(getconf DARWIN_USER_TEMP_DIR)"; do
            cp "$dir"/histogram-*.png build/probe/ 2>/dev/null || true
          done
          ls -la build/probe

      - name: Upload the probe's images and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: histogram-probe
          path: build/probe
