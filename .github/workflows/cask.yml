name: Update cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point the cask at, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: cask
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Point Casks/redlamp.rb at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" --pattern "Redlamp-$VERSION.zip" --dir "$RUNNER_TEMP"
          SHA="$(sha256sum "$RUNNER_TEMP/Redlamp-$VERSION.zip" | cut -d' ' -f1)"
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            Casks/redlamp.rb
          if git diff --quiet; then
            echo "Cask already points at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Cask: redlamp $VERSION"
          git push
