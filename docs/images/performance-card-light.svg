<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="rl-title rl-desc">
<title id="rl-title">Redlamp's measured performance</title>
<desc id="rl-desc">Redlamp's measured performance on an Apple M1 Ultra with a Release build, 29 Sep – 8 Oct 2026: 1.8 ms to render a slider change; 160 ms to open a 24 MP raw; 317 MB peak, browsing 50,000 photos (measured under load); 1.3 GB GPU, 1:1 with noise reduction; 22.1 MB to download; 44.9 MB installed.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}.n{font-variant-numeric:tabular-nums}</style>
<defs><radialGradient id="rl-glow" cx="45" cy="37" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D8352A" stop-opacity="0.06"/><stop offset="0.35" stop-color="#D8352A" stop-opacity="0.018"/><stop offset="1" stop-color="#D8352A" stop-opacity="0"/></radialGradient><clipPath id="rl-card"><rect width="880" height="320" rx="16"/></clipPath></defs>
<g clip-path="url(#rl-card)">
<rect width="880" height="320" fill="#F3EEE8"/>
<rect width="880" height="320" fill="url(#rl-glow)"/>
<g transform="translate(32 24) scale(0.5417)"><mask id="rl-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#fff"/><circle cx="19" cy="19" r="2.6" fill="#000"/><circle cx="24" cy="4.4" r="1.25" fill="#000"/><circle cx="40.97" cy="33.8" r="1.25" fill="#000"/><circle cx="7.03" cy="33.8" r="1.25" fill="#000"/></mask><g mask="url(#rl-holes)"><circle cx="24" cy="24" r="19.6" fill="none" stroke="#1A1414" stroke-width="4.8"/><circle cx="24" cy="24" r="12.6" fill="#D8352A"/></g></g>
